# API gateway = the only public entry point. Routes each URL to the microservice that owns it.
#
#   /api/v1/events/{id}/availability  -> booking-service
#   /api/v1/events...                 -> event-service
#   /api/v1/bookings/{id}/pay         -> payment-service
#   /api/v1/payments...               -> payment-service
#   /api/v1/bookings...               -> booking-service
#   /api/v1/tickets...                -> ticket-service
#   /api/v1/stats/{event|...}        -> that service's /api/v1/stats (numbers for the dashboard)
#   /health/{event|booking|payment|ticket}  -> that service's /health
#   /  and /static/*                 -> the dashboard page (web/, served by nginx itself)
#   /internal/...                     -> NOT routed: service-to-service only
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr req_id=$request_id';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Docker's DNS. Re-resolving names every 5s means new replicas
    # (docker compose up --scale booking-service=3) are picked up without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Basic protection against flooding: 20 requests/second per client IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server {
        listen 80;
        client_max_body_size 64k;
        default_type application/json;

        set $event_service   http://event-service:5000;
        set $booking_service http://booking-service:5000;
        set $payment_service http://payment-service:5000;
        set $ticket_service  http://ticket-service:5000;

        # Applied to every proxied location below
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;   # followed through every service log
        add_header       X-Request-ID      $request_id always;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
        proxy_next_upstream error timeout http_502 http_503;   # one replica down -> try the next
        proxy_intercept_errors on;
        error_page 502 504 = @unavailable;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Dashboard: static files, no service involved
        root /usr/share/nginx/html;
        location = / {
            try_files /index.html =404;
        }
        location /static/ {
            add_header Cache-Control "no-cache";   # always check for a newer page script
        }

        location = /api {
            return 200 '{"service":"ticket-booking gateway","services":["event-service","booking-service","payment-service","ticket-service"],"health":"/health/{event|booking|payment|ticket}","api":"/api/v1"}\n';
        }

        location ~ ^/health/(?<svc>event|booking|payment|ticket)$ {
            proxy_intercept_errors off;            # pass the service's own 503 JSON through
            proxy_pass http://$svc-service:5000/health;
        }

        location ~ ^/api/v1/stats/(?<svc>event|booking|payment|ticket)$ {
            proxy_intercept_errors off;
            proxy_pass http://$svc-service:5000/api/v1/stats;
        }

        location ~ ^/api/v1/events/\d+/availability$ { proxy_pass $booking_service; }
        location /api/v1/events                      { proxy_pass $event_service; }
        location ~ ^/api/v1/bookings/\d+/pay$        { proxy_pass $payment_service; }
        location /api/v1/payments                    { proxy_pass $payment_service; }
        location /api/v1/bookings                    { proxy_pass $booking_service; }
        location /api/v1/tickets                     { proxy_pass $ticket_service; }

        location @unavailable {
            return 503 '{"error":"service unavailable"}\n';
        }

        # Everything else, including /internal/*, is not exposed.
        location / {
            return 404 '{"error":"not found"}\n';
        }
    }
}
