# Nginx = the only public entry point. It forwards traffic to the "app" replicas.
worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr req_id=$request_id';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Docker's DNS. Re-resolving "app" every 5s means new replicas (docker compose
    # up --scale app=3) and recreated containers are picked up without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Basic protection against flooding: 20 requests/second per client IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server {
        listen 80;
        client_max_body_size 64k;

        set $app_upstream http://app:5000;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;

            proxy_pass $app_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            add_header       X-Request-ID      $request_id always;

            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
            # If one replica is down, try the next one
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
