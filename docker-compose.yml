# EP10 — Real-world stack: Nginx -> Flask -> Postgres, monitored by cAdvisor
#
#   browser :80 ──> nginx ──(backend network)──> app ──> db (dbdata volume)
#   browser :8080 ──> cadvisor (reads stats of every container)

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - dbdata:/var/lib/postgresql/data       # data survives "docker compose down"
    networks: [backend]
    restart: unless-stopped
    # Lab 2: Postgres healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: ./flask-app
    image: ep10-flask-app:latest
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    expose:
      - "5000"                                # only reachable inside Docker, not from host
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy            # wait until Postgres is READY, not just started
    restart: unless-stopped
    # Lab 2: Flask healthcheck (/health also checks the DB connection)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [frontend, backend]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Lab 3: container metrics (CPU, memory, network, disk) at http://localhost:8080
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks: [frontend]
    restart: unless-stopped

networks:
  frontend: {}
  backend: {}

volumes:
  dbdata:
