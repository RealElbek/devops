name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # scan the whole history, not only the last commit
      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v

  # One job per microservice, in parallel: each is linted and tested on its own,
  # against its own real Postgres.
  service-tests:
    name: Test ${{ matrix.service }}-service
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [event, booking, payment, ticket]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Lint (ruff) + pytest
        run: docker compose --profile test run --rm --build tests-${{ matrix.service }}
      - name: Logs on failure
        if: failure()
        run: docker compose --profile test logs
      - if: always()
        run: docker compose --profile test down -v

  # Single required check for branch protection: green only if every service passed.
  test:
    name: Lint + tests (real Postgres)
    runs-on: ubuntu-latest
    needs: service-tests
    if: always()
    steps:
      - name: All service tests passed
        run: test "${{ needs.service-tests.result }}" = success

  e2e:
    name: Full stack (smoke + resilience)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start stack (waits for all healthchecks)
        run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose ps
      - name: Smoke test (booking flow through the gateway, all services)
        run: ./scripts/smoke_test.sh
      - name: Resilience test (persistence, scaling, fault isolation)
        run: ./scripts/resilience_test.sh
      - name: cAdvisor is up
        run: curl -fsS -o /dev/null http://localhost:8080/containers/
      - name: Resource usage
        if: always()
        run: docker stats --no-stream
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
