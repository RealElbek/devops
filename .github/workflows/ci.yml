name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # scan the whole history, not only the last commit
      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v

  # One job per microservice, in parallel: each is linted and tested on its own,
  # against its own real Postgres.
  service-tests:
    name: Test ${{ matrix.service }}-service
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [event, booking, payment, ticket]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Lint (ruff) + pytest
        run: docker compose --profile test run --rm --build tests-${{ matrix.service }}
      - name: Logs on failure
        if: failure()
        run: docker compose --profile test logs
      - if: always()
        run: docker compose --profile test down -v

  # Single required check for branch protection: green only if every service passed.
  test:
    name: Lint + tests (real Postgres)
    runs-on: ubuntu-latest
    needs: service-tests
    if: always()
    steps:
      - name: All service tests passed
        run: test "${{ needs.service-tests.result }}" = success

  # Security: scan every service image for known vulnerabilities (Debian packages + Python packages).
  # Fails on HIGH/CRITICAL findings that have a fix available, so a fixable hole never reaches main.
  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Build the 4 service images
        run: docker compose build event-service booking-service payment-service ticket-service
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          status=0
          for svc in event booking payment ticket; do
            echo "::group::ticketing-$svc-service"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
              image --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "ticketing-$svc-service:local" || status=1
            echo "::endgroup::"
          done
          exit $status

  e2e:
    name: Full stack (smoke + resilience)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start stack (waits for all healthchecks)
        run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose ps
      - name: Smoke test (booking flow through the gateway, all services)
        run: ./scripts/smoke_test.sh
      - name: Resilience test (persistence, scaling, fault isolation)
        run: ./scripts/resilience_test.sh
      - name: cAdvisor is up
        run: curl -fsS -o /dev/null http://localhost:8080/containers/
      - name: Resource usage
        if: always()
        run: docker stats --no-stream
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # Delivery: after a merge to main, and only if every check passed, push the 4 service images
  # to GitHub Container Registry (ghcr.io). Pull requests never publish.
  publish:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    needs: [secret-scan, test, image-scan, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write                 # only this job may write to the registry
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build, tag and push the 4 service images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"          # registry names must be lowercase
          short_sha="${GITHUB_SHA::7}"
          docker compose build event-service booking-service payment-service ticket-service
          for svc in event booking payment ticket; do
            image="ghcr.io/$owner/ticketing-$svc-service"
            docker tag "ticketing-$svc-service:local" "$image:sha-$short_sha"
            docker tag "ticketing-$svc-service:local" "$image:latest"
            docker push "$image:sha-$short_sha"
            docker push "$image:latest"
            echo "pushed $image:sha-$short_sha and :latest" >> "$GITHUB_STEP_SUMMARY"
          done
