# Shared lint + test settings, copied into every service's test image.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = [
  "common", "event_service", "booking_service", "payment_service", "ticket_service", "conftest",
]
